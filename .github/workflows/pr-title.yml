name: Título do PR

# Usamos squash merge: o título do PR vira a mensagem do commit no main,
# então ele precisa seguir Conventional Commits (feat:, fix:, docs:, ...).
#
# pull_request_target é seguro aqui porque o job só lê o título do PR;
# NUNCA faça checkout do código do fork neste workflow.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
