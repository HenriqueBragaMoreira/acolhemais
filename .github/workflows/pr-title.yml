name: Título do PR

# Usamos squash merge: o título do PR vira a mensagem do commit no main,
# então ele precisa seguir Conventional Commits (feat:, fix:, docs:, ...).
#
# pull_request_target é seguro aqui porque o job só lê o título do PR;
# NUNCA faça checkout do código do fork neste workflow.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
